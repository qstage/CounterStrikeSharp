version: 2
updates:
  # Update the submodule in libraries/s2sdk every day
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    allow:
      - dependency-name: "libraries/s2sdk"
      - dependency-name: "libraries/metamod-source"
      - dependency-name: "libraries/Protobufs"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"
